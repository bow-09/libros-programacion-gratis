name: meta-code · pruebas y APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'meta-code/**'
      - '.github/workflows/build_apk.yml'
  pull_request:
    paths:
      - 'meta-code/**'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: meta-code

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Compilar APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: meta-code-apk
          path: meta-code/build/app/outputs/flutter-apk/app-release.apk
